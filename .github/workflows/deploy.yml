name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Проверки перед выкладкой
        run: npm run check

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 89.125.121.144 >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: rsync -avz --delete --chown=caddy:caddy -e "ssh -i ~/.ssh/deploy_key" dist/ root@89.125.121.144:/var/www/rabota-vsem-56.ru/
