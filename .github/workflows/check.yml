name: Проверка

on:
  push:
    branches: [main, 'stage*']
  pull_request:
    branches: [main, 'stage*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  supabase:
    # Настоящий Supabase дополняет PGlite: здесь схемы Auth/Storage создаёт сам стек.
    # Не блокирует: образы тянутся с Docker Hub, а у общих раннеров GitHub он часто отвечает «toomanyrequests».
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:check
      - if: always()
        run: npm run db:stop
